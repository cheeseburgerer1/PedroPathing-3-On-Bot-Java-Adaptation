name: Compile OnBot Java sources

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Extract FTC 12.0 OnBot compiler libraries
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/FIRST-Tech-Challenge/FtcRobotController/releases/download/v12.0/FtcRobotController-release.apk \
            -o "$RUNNER_TEMP/rc.apk"
          echo "0f5a94fad17e7e114a7839328f41e92bda7e7a419a6b732df53446a48b5cd972  $RUNNER_TEMP/rc.apk" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/onbot"
          unzip -jo "$RUNNER_TEMP/rc.apk" 'assets/*jar' -d "$RUNNER_TEMP/onbot"
          test -s "$RUNNER_TEMP/onbot/android.jar"
          test -s "$RUNNER_TEMP/onbot/onbotjava-classes.jar"
      - name: Compile every source and run path checks
        run: |
          libs="$RUNNER_TEMP/onbot"
          out="$RUNNER_TEMP/pedro-classes"
          mkdir -p "$out"
          find src -name '*.java' | sort > "$RUNNER_TEMP/sources"
          boot=$(find "$libs" -name '*.jar' | sort | paste -sd :)
          javac -encoding UTF-8 -source 8 -target 8 -proc:none -bootclasspath "$boot" -d "$out" @"$RUNNER_TEMP/sources"
          java -cp "$out" org.firstinspires.ftc.teamcode.pedro.PathGeometryCheck
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android DEX
        run: |
          jar cf "$RUNNER_TEMP/pedro.jar" -C "$RUNNER_TEMP/pedro-classes" .
          d8=$(find "$ANDROID_HOME/build-tools" -name d8 | sort -V | tail -1)
          "$d8" --min-api 24 --lib "$RUNNER_TEMP/onbot/android.jar" \
            --classpath "$RUNNER_TEMP/onbot/onbotjava-classes.jar" \
            --output "$RUNNER_TEMP/pedro-dex.zip" "$RUNNER_TEMP/pedro.jar"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run the diagnostic on Android 7.1
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 25
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb push "$RUNNER_TEMP/pedro-dex.zip" /data/local/tmp/pedro-dex.zip
            adb shell dalvikvm -cp /data/local/tmp/pedro-dex.zip org.firstinspires.ftc.teamcode.pedro.PathGeometryCheck
